<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Bagged Up monogram">
  <title>Bagged Up monogram</title>
  <desc>The B mark: an ivory italic serif B on an espresso tile. Used for avatars, packaging seals and anywhere the wordmark is too wide.</desc>
  <rect width="256" height="256" rx="40" fill="#201A15"/>
  <text x="128" y="178" text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif"
        font-size="150" font-weight="500" font-style="italic" fill="#FAF7F1">B</text>
  <rect x="96" y="196" width="64" height="3" fill="#8A6A3D"/>
</svg>
